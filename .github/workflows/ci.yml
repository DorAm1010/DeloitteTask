name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit and agent-loop tests (no API key or network needed)
        run: pytest -q
      # Evals call the real model and cost money, so they run on demand:
      #   python -m tests.evals.run   (needs ANTHROPIC_API_KEY)
