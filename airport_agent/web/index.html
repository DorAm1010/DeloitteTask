<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Airport Investment Agent</title>
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<script src="/vendor/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5f6b7a; --border: #dde2e8;
    --accent: #0b6e4f; --accent-soft: #e3f2ec; --user: #1f4e79; --user-text: #ffffff; --code: #f0f2f5;
    /* Categorical chart palette in fixed order (CVD-validated reference palette) */
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
    --grid: #e6e8eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c; --panel: #1b2129; --text: #e6e9ee; --muted: #9aa5b3; --border: #2c3440;
      --accent: #3fbf8f; --accent-soft: #1e3a30; --user: #2b5f8f; --user-text: #ffffff; --code: #242b35;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
      --grid: #2c3440;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 14px 20px; border-bottom: 1px solid var(--border); background: var(--panel); }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  main { flex: 1; min-height: 0; width: 100%; max-width: 900px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; }
  #chat { flex: 1; overflow-y: auto; padding-bottom: 12px; }
  .msg { margin: 10px 0; padding: 12px 14px; border-radius: 10px; max-width: 100%; overflow-x: auto; }
  .user { background: var(--user); color: var(--user-text); margin-left: 15%; }
  .bot { background: var(--panel); border: 1px solid var(--border); }
  .bot table { border-collapse: collapse; margin: 8px 0; font-size: 14px; }
  .bot th, .bot td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
  .bot code, .bot pre { background: var(--code); border-radius: 4px; }
  .bot pre { padding: 8px; overflow-x: auto; font-size: 12px; }
  details.trace { margin-top: 10px; font-size: 13px; color: var(--muted); }
  details.trace summary { cursor: pointer; }
  .chart { margin-top: 12px; }
  .chart h4 { margin: 0 0 6px; font-size: 14px; font-weight: 600; }
  .chart .canvas-wrap { position: relative; width: 100%; }
  .chart .source { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .chart details { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .usage { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .tool { border-left: 3px solid var(--accent); padding: 4px 10px; margin: 8px 0; }
  .tool.err { border-color: #c0392b; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
  .chip { border: 1px solid var(--border); background: var(--panel); color: var(--text); border-radius: 16px; padding: 6px 12px; cursor: pointer; font-size: 13px; }
  .chip:hover { background: var(--accent-soft); }
  form { display: flex; gap: 8px; }
  textarea { flex: 1; resize: none; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel); color: var(--text); font: inherit; min-height: 44px; }
  button { border: 0; border-radius: 8px; padding: 0 14px; font: inherit; cursor: pointer; background: var(--accent); color: #fff; }
  button.secondary { background: var(--panel); color: var(--text); border: 1px solid var(--border); }
  button.recording { background: #c0392b; }
  .toolbar { display: flex; gap: 12px; align-items: center; margin-top: 8px; font-size: 13px; color: var(--muted); }
  .thinking { color: var(--muted); font-style: italic; }
  @media (max-width: 600px) { .user { margin-left: 0; } main { padding: 12px 16px; } }
</style>
</head>
<body>
<header>
  <h1>Airport Investment Intelligence Agent</h1>
  <p id="vintage">Loading data status...</p>
</header>
<main>
  <div id="chat">
    <div class="msg bot">Ask me about US airport demand, capacity and congestion. I rank airports with a
      deterministic scoring model on public BTS/FAA data and explain how I got each number.
      Open "How I got this" under any answer to see the tool calls.</div>
    <div class="chips" id="chips"></div>
  </div>
  <form id="form">
    <textarea id="input" placeholder="Ask a question... (Enter to send, Shift+Enter for a new line)"></textarea>
    <button type="button" id="mic" class="secondary" title="Speak your question">🎤</button>
    <button type="submit" id="send">Send</button>
  </form>
  <div class="toolbar">
    <label><input type="checkbox" id="speak"> Read answers aloud</label>
    <button type="button" id="reset" class="secondary" style="padding:4px 10px">New conversation</button>
  </div>
</main>
<script>
const EXAMPLES = [
  "Which airports in New England are strong candidates for terminal expansion?",
  "Compare LA and Santa Ana airport congestion levels.",
  "What is the percentage of long haul flights out of Anchorage airport?",
  "What is the unmet flight demand in SFO airport and why?",
];
const chat = document.getElementById("chat");
const input = document.getElementById("input");
let sessionId = null;

function esc(s) { return s.replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c])); }
function scrollDown() { chat.scrollTop = chat.scrollHeight; }

function addMessage(cls, html) {
  const div = document.createElement("div");
  div.className = "msg " + cls;
  div.innerHTML = html;
  chat.appendChild(div);
  scrollDown();
  return div;
}

// --- Charts: specs come from the server (computed by charts.py), never from the model's text ---
let chartCount = 0;
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const fmt = (v, kind) => v == null ? "–" : kind === "percent" ? (v * 100).toFixed(1) + "%" : Number(v).toLocaleString();

function chartHtml(spec) {
  const id = "chart" + (++chartCount);
  const n = spec.horizontal ? spec.labels.length : 0;
  const height = spec.horizontal ? 60 + n * 32 : 260;
  const head = "<tr><th></th>" + spec.series.map(s => `<th>${esc(s.name)}</th>`).join("") + "</tr>";
  const rows = spec.labels.map((l, i) => `<tr><td>${esc(String(l))}</td>` +
    spec.series.map(s => `<td>${fmt(s.values[i], spec.value_format)}</td>`).join("") + "</tr>").join("");
  return {id, html: `<div class="chart"><h4>${esc(spec.title)}</h4>
    <div class="canvas-wrap" style="height:${height}px"><canvas id="${id}" role="img" aria-label="${esc(spec.title)}"></canvas></div>
    <div class="source">Source: ${esc(spec.source)}</div>
    <details><summary>View data</summary><table>${head}${rows}</table></details></div>`};
}

function drawChart(id, spec) {
  const text = cssVar("--muted"), grid = cssVar("--grid"), surface = cssVar("--panel");
  const valueAxis = {grid: {color: grid}, ticks: {color: text, callback: v => fmt(v, spec.value_format)},
                     stacked: !!spec.stacked, beginAtZero: spec.type === "bar"};
  const catAxis = {grid: {display: false}, ticks: {color: text, autoSkip: true, maxRotation: 0}, stacked: !!spec.stacked};
  new Chart(document.getElementById(id), {
    type: spec.type,
    data: {labels: spec.labels, datasets: spec.series.map((s, i) => {
      const color = cssVar("--s" + ((i % 8) + 1));
      return spec.type === "line"
        ? {label: s.name, data: s.values, borderColor: color, backgroundColor: color, borderWidth: 2,
           pointRadius: 0, pointHoverRadius: 5, spanGaps: true, tension: 0.2}
        : {label: s.name, data: s.values, backgroundColor: color, borderColor: surface, borderWidth: 1,
           borderRadius: 4, maxBarThickness: spec.horizontal ? 22 : 36};
    })},
    options: {
      responsive: true, maintainAspectRatio: false, indexAxis: spec.horizontal ? "y" : "x",
      interaction: {mode: "index", intersect: false},
      plugins: {
        legend: {display: spec.series.length > 1, position: "bottom", labels: {color: text, boxWidth: 12}},
        tooltip: {callbacks: {label: c => `${c.dataset.label}: ${fmt(c.raw, spec.value_format)}`}},
      },
      scales: spec.horizontal ? {x: valueAxis, y: catAxis} : {x: catAxis, y: valueAxis},
    },
  });
}

function renderUsage(u) {
  if (!u) return "";
  const tokens = u.input_tokens + u.output_tokens + u.cache_creation_input_tokens + u.cache_read_input_tokens;
  const cost = u.cost_usd == null ? "" : ` · ~$${u.cost_usd.toFixed(3)}`;
  return `<div class="usage">${u.latency_s}s · ${u.model_calls} model call${u.model_calls === 1 ? "" : "s"} · ` +
         `${tokens.toLocaleString()} tokens (${u.cache_read_input_tokens.toLocaleString()} cached)${cost}</div>`;
}

function renderTrace(calls, usage) {
  const u = renderUsage(usage);
  if (!calls.length) return u;
  const items = calls.map(c => `<div class="tool ${c.is_error ? "err" : ""}">
      <b>${esc(c.name)}</b> <code>${esc(JSON.stringify(c.input))}</code>
      <pre>${esc(c.output_preview)}</pre></div>`).join("");
  return `<details class="trace"><summary>How I got this (${calls.length} tool call${calls.length > 1 ? "s" : ""})</summary>${items}</details>${u}`;
}

function speak(text) {
  if (!document.getElementById("speak").checked || !("speechSynthesis" in window)) return;
  const plain = text.replace(/[#*_`|>-]/g, " ").replace(/\s+/g, " ");
  speechSynthesis.cancel();
  speechSynthesis.speak(new SpeechSynthesisUtterance(plain));
}

async function send(text) {
  if (!text.trim()) return;
  addMessage("user", esc(text));
  input.value = "";
  const pending = addMessage("bot thinking", "Analyzing... (querying data and scoring airports)");
  try {
    const res = await fetch("/api/chat", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({message: text, session_id: sessionId}),
    });
    if (!res.ok) throw new Error((await res.json()).detail || res.statusText);
    const data = await res.json();
    sessionId = data.session_id;
    pending.className = "msg bot";
    const charts = (data.charts || []).map(spec => ({spec, ...chartHtml(spec)}));
    pending.innerHTML = DOMPurify.sanitize(marked.parse(data.answer)) + charts.map(c => c.html).join("") +
                        renderTrace(data.tool_calls, data.usage);
    charts.forEach(c => drawChart(c.id, c.spec));
    speak(data.answer);
  } catch (err) {
    pending.className = "msg bot";
    pending.textContent = "Error: " + err.message;
  }
  scrollDown();
}

document.getElementById("form").addEventListener("submit", e => { e.preventDefault(); send(input.value); });
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(input.value); }
});
document.getElementById("reset").addEventListener("click", async () => {
  if (sessionId) await fetch("/api/reset", {method: "POST", headers: {"Content-Type": "application/json"},
                                             body: JSON.stringify({message: "", session_id: sessionId})});
  sessionId = null;
  addMessage("bot", "<i>Started a new conversation.</i>");
});

const chips = document.getElementById("chips");
EXAMPLES.forEach(q => {
  const b = document.createElement("button");
  b.className = "chip"; b.type = "button"; b.textContent = q;
  b.onclick = () => send(q);
  chips.appendChild(b);
});

// Voice input: browser Web Speech API (Chrome/Edge/Safari). No server-side audio needed.
const mic = document.getElementById("mic");
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (!Recognition) {
  mic.disabled = true; mic.title = "Voice input not supported in this browser";
} else {
  const rec = new Recognition();
  rec.lang = "en-US"; rec.interimResults = true;
  rec.onresult = e => { input.value = Array.from(e.results).map(r => r[0].transcript).join(""); };
  rec.onend = () => { mic.classList.remove("recording"); if (input.value.trim()) send(input.value); };
  mic.onclick = () => { mic.classList.add("recording"); rec.start(); };
}

fetch("/api/status").then(r => r.json()).then(d => {
  const v = d.data_vintage;
  document.getElementById("vintage").textContent =
    `Data: BTS T-100 ${v.t100_airport_totals} · international routes ${v.t100_international_routes || "n/a"} · ` +
    `on-time ${v.bts_on_time || "n/a"} · FAA delays live`;
});
</script>
</body>
</html>
