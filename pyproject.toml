[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "airport-agent"
version = "0.2.0"
description = "Airport Investment Intelligence Agent: deterministic airport scoring on public BTS/FAA data, explained by Claude."
readme = "README.md"
requires-python = ">=3.11"
# Exact pins = the versions this was built and tested with.
dependencies = [
    "anthropic==1.8.0",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "pandas==3.0.6",
    "numpy==2.4.6",
    "requests==2.34.2",
    "python-dotenv==1.2.3",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools]
packages = ["airport_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
